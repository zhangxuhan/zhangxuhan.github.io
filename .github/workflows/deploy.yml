name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          SITE_DIR="${RUNNER_TEMP}/site"
          mkdir -p "$SITE_DIR"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='package*.json' \
            --exclude='run-hexo.bat' \
            --exclude='start-server.js' \
            --exclude='_config.yml' \
            --exclude='task-summary*.md' \
            --exclude='.workbuddy/' \
            ./ "$SITE_DIR/"

          test -f "$SITE_DIR/index.html"
          test -f "$SITE_DIR/sim/index.html"
          test -f "$SITE_DIR/sim/neural/index.html"
          echo "Verified sim/neural/index.html in Pages artifact"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
